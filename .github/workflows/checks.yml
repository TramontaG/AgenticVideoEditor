name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.3
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/video-edit/assets/toolchain/package-lock.json
      - run: npm ci --prefix skills/video-edit/assets/toolchain --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s tests -p test_video_processing.py -v
      - run: node --test tests/animation-output.test.mjs
      - name: Test page capture
        shell: python
        run: |
          import subprocess
          import sys
          result = subprocess.run(
              ['node', '--test', 'tests/page-capture.test.mjs'],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          )
          print(result.stdout)
          if result.returncode:
              detail = result.stdout[-30000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Page capture tests::' + detail)
          sys.exit(result.returncode)
      - run: npx --prefix skills/video-edit/assets/toolchain tsc --project skills/video-edit/assets/toolchain/tsconfig.json
      - run: node --check skills/video-edit/assets/toolchain/render.mjs
      - run: node --check skills/video-edit/assets/toolchain/motion-render.mjs
      - run: node --check skills/video-edit/assets/toolchain/capture-page.mjs
